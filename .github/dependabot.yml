version: 2
updates:
  # npm — the TypeScript harness + GitHub Action
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python deps for the Google ADK runner
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
