name: Test Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      eval-file:
        description: 'Path to a task-package or suite directory'
        required: false
        default: 'evals/example-greeting'
      no-judge:
        description: 'Skip LLM judge (deterministic only)'
        required: false
        type: boolean
        default: true
      runs-number:
        description: 'Number of times to run each task'
        required: false
        type: number
        default: 3
      compare:
        description: 'Run with and without skill to measure skill impact'
        required: false
        type: boolean
        default: false
      blind-compare:
        description: 'Run blind A/B comparison alongside --compare'
        required: false
        type: boolean
        default: false
      generate-feedback:
        description: 'Generate feedback template JSON for human review'
        required: false
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: claude-sdk
            model: sonnet
            name: claude-sdk-sonnet
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run evaluation
        run: |
          ARGS="--verbose --runs $RUNS_NUMBER --runner $RUNNER --model $MODEL --github-summary"
          # NO_JUDGE defaults to "no judge"; gh CLI dispatch leaves booleans
          # empty rather than applying the YAML default, so treat anything
          # other than explicit "false" as "skip judge".
          if [ "$NO_JUDGE" != "false" ]; then
            ARGS="$ARGS --no-judge"
          fi
          if [ "$COMPARE" = "true" ]; then
            ARGS="$ARGS --compare"
          fi
          if [ "$BLIND_COMPARE" = "true" ]; then
            ARGS="$ARGS --blind-compare"
          fi
          if [ "$GENERATE_FEEDBACK" = "true" ]; then
            ARGS="$ARGS --generate-feedback results/feedback-template.json"
          fi
          node dist/src/cli.js run "$EVAL_FILE" $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_FILE: ${{ inputs.eval-file }}
          NO_JUDGE: ${{ inputs.no-judge }}
          RUNS_NUMBER: ${{ inputs.runs-number }}
          COMPARE: ${{ inputs.compare }}
          BLIND_COMPARE: ${{ inputs.blind-compare }}
          GENERATE_FEEDBACK: ${{ inputs.generate-feedback }}
          RUNNER: ${{ matrix.runner }}
          MODEL: ${{ matrix.model }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ matrix.name }}
          path: results/

  action-test:
    runs-on: ubuntu-latest
    name: action-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Test bundled action
        uses: ./action
        with:
          tasks: evals/example-greeting
          runner: claude-sdk
          model: sonnet
          no-judge: 'true'
          runs: '1'
          threshold-discovery: '0'
          threshold-score: '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-action-test
          path: results/
