name: Test Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      eval-file:
        description: 'Path to a task-package or suite directory'
        required: false
        default: 'evals/example-greeting'
      judge:
        description: 'Enable LLM judge diagnostics'
        required: false
        type: boolean
        default: false
      runs-number:
        description: 'Number of trials per task per condition'
        required: false
        type: number
        default: 3
      baseline:
        description: 'Run the paired no-skill baseline (default: on when skills present)'
        required: false
        type: boolean
        default: true
      blind-compare:
        description: 'Run blind A/B comparison (requires compare-skill + judge)'
        required: false
        type: boolean
        default: false
      generate-feedback:
        description: 'Generate feedback template JSON for human review'
        required: false
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: claude-sdk
            model: sonnet
            name: claude-sdk-sonnet
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run evaluation
        run: |
          ARGS="--verbose --trials $RUNS_NUMBER --runner $RUNNER --model $MODEL --github-summary"
          # The judge is off by default; only pass --judge when explicitly enabled.
          if [ "$JUDGE" = "true" ]; then
            ARGS="$ARGS --judge"
          fi
          # Baseline defaults to on when skills are present; only pass
          # --no-baseline when explicitly disabled.
          if [ "$BASELINE" = "false" ]; then
            ARGS="$ARGS --no-baseline"
          fi
          if [ "$BLIND_COMPARE" = "true" ]; then
            ARGS="$ARGS --blind-compare"
          fi
          if [ "$GENERATE_FEEDBACK" = "true" ]; then
            ARGS="$ARGS --generate-feedback results/feedback-template.json"
          fi
          node dist/src/cli.js run "$EVAL_FILE" $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_FILE: ${{ inputs.eval-file }}
          JUDGE: ${{ inputs.judge }}
          RUNS_NUMBER: ${{ inputs.runs-number }}
          BASELINE: ${{ inputs.baseline }}
          BLIND_COMPARE: ${{ inputs.blind-compare }}
          GENERATE_FEEDBACK: ${{ inputs.generate-feedback }}
          RUNNER: ${{ matrix.runner }}
          MODEL: ${{ matrix.model }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ matrix.name }}
          path: results/

  action-test:
    runs-on: ubuntu-latest
    name: action-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Test bundled action
        uses: ./action
        with:
          tasks: evals/example-greeting
          runner: claude-sdk
          model: sonnet
          judge: 'false'
          runs: '1'
          threshold-resolution: '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-action-test
          path: results/
