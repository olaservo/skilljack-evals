name: Test Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      eval-file:
        description: 'Path to tasks YAML file'
        required: false
        default: 'evals/example-greeting/tasks.yaml'
      no-judge:
        description: 'Skip LLM judge (deterministic only)'
        required: false
        type: boolean
        default: true
      runs-number:
        description: 'Number of times to run each task'
        required: false
        type: number
        default: 3
      compare:
        description: 'Run with and without skill to measure skill impact'
        required: false
        type: boolean
        default: false
      blind-compare:
        description: 'Run blind A/B comparison alongside --compare'
        required: false
        type: boolean
        default: false
      generate-feedback:
        description: 'Generate feedback template JSON for human review'
        required: false
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: claude-sdk
            model: sonnet
            name: claude-sdk-sonnet
          - runner: vercel-ai
            model: 'anthropic:claude-sonnet-4-6'
            name: vercel-ai-sonnet
          - runner: vercel-ai
            model: 'google:gemini-2.5-pro'
            name: vercel-ai-gemini
          - runner: vercel-ai
            model: 'openai:gpt-5.2'
            name: vercel-ai-gpt
          - runner: openai-agents
            model: gpt-5.2
            name: openai-agents-gpt
          - runner: vercel-ai
            model: 'openrouter:deepseek/deepseek-v3.2'
            name: vercel-ai-openrouter-deepseek
          - runner: vercel-ai
            model: 'openrouter:minimax/minimax-m2.5'
            name: vercel-ai-openrouter-minimax
          - runner: vercel-ai
            model: 'openrouter:moonshotai/kimi-k2.5'
            name: vercel-ai-openrouter-kimi
          - runner: vercel-ai
            model: 'openrouter:z-ai/glm-5'
            name: vercel-ai-openrouter-glm
          - runner: vercel-ai
            model: 'openrouter:openai/gpt-oss-120b'
            name: vercel-ai-openrouter-gpt-oss
          - runner: copilot-sdk
            model: gpt-5
            name: copilot-sdk-gpt
            node-version: '23'
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version || '20' }}

      - name: Install dependencies
        run: npm install

      - name: Install peer dependencies
        if: matrix.runner != 'claude-sdk'
        run: |
          if [ "${{ matrix.runner }}" = "vercel-ai" ]; then
            npm install ai zod @ai-sdk/openai @ai-sdk/anthropic @ai-sdk/google @openrouter/ai-sdk-provider
          elif [ "${{ matrix.runner }}" = "openai-agents" ]; then
            npm install @openai/agents openai
          elif [ "${{ matrix.runner }}" = "copilot-sdk" ]; then
            npm install @github/copilot-sdk
          fi

      - name: Build
        run: npm run build

      - name: Run evaluation
        run: |
          ARGS="--verbose --runs $RUNS_NUMBER --runner $RUNNER --model $MODEL --github-summary"
          if [ "$NO_JUDGE" = "true" ]; then
            ARGS="$ARGS --no-judge"
          fi
          if [ "$COMPARE" = "true" ]; then
            ARGS="$ARGS --compare"
          fi
          if [ "$BLIND_COMPARE" = "true" ]; then
            ARGS="$ARGS --blind-compare"
          fi
          if [ "$GENERATE_FEEDBACK" = "true" ]; then
            ARGS="$ARGS --generate-feedback results/feedback-template.json"
          fi
          node dist/src/cli.js run "$EVAL_FILE" $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_FILE: ${{ inputs.eval-file }}
          NO_JUDGE: ${{ inputs.no-judge }}
          RUNS_NUMBER: ${{ inputs.runs-number }}
          COMPARE: ${{ inputs.compare }}
          BLIND_COMPARE: ${{ inputs.blind-compare }}
          GENERATE_FEEDBACK: ${{ inputs.generate-feedback }}
          RUNNER: ${{ matrix.runner }}
          MODEL: ${{ matrix.model }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.name }}
          path: results/

  action-test:
    runs-on: ubuntu-latest
    name: action-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Test bundled action
        uses: ./action
        with:
          tasks: evals/example-greeting/tasks.yaml
          runner: claude-sdk
          model: sonnet
          no-judge: 'true'
          runs: '1'
          threshold-discovery: '0'
          threshold-score: '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-action-test
          path: results/
