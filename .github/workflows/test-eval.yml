name: Test Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      eval-file:
        description: 'Path to tasks YAML file'
        required: false
        default: 'evals/example-greeting/tasks.yaml'
      no-judge:
        description: 'Skip LLM judge (deterministic only)'
        required: false
        type: boolean
        default: true
      runs-number:
        description: 'Number of times to run each task'
        required: false
        type: number
        default: 3

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: claude-sdk
            model: sonnet
            name: claude-sdk-sonnet
          - runner: vercel-ai
            model: 'anthropic:claude-sonnet-4-6'
            name: vercel-ai-sonnet
          - runner: vercel-ai
            model: 'google:gemini-2.5-pro'
            name: vercel-ai-gemini
          - runner: vercel-ai
            model: 'openai:gpt-5.2'
            name: vercel-ai-gpt
          - runner: openai-agents
            model: gpt-5.2
            name: openai-agents-gpt
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install peer dependencies
        if: matrix.runner != 'claude-sdk'
        run: |
          if [ "${{ matrix.runner }}" = "vercel-ai" ]; then
            npm install ai zod @ai-sdk/openai @ai-sdk/anthropic @ai-sdk/google
          elif [ "${{ matrix.runner }}" = "openai-agents" ]; then
            npm install @openai/agents openai
          fi

      - name: Build
        run: npm run build

      - name: Run evaluation
        run: |
          ARGS="--verbose --runs $RUNS_NUMBER --runner $RUNNER --model $MODEL"
          if [ "$NO_JUDGE" = "true" ]; then
            ARGS="$ARGS --no-judge"
          fi
          node dist/src/cli.js run "$EVAL_FILE" $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          EVAL_FILE: ${{ inputs.eval-file }}
          NO_JUDGE: ${{ inputs.no-judge }}
          RUNS_NUMBER: ${{ inputs.runs-number }}
          RUNNER: ${{ matrix.runner }}
          MODEL: ${{ matrix.model }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.name }}
          path: results/
