name: 'Agent Skill Evaluation'
description: 'Run agent skill evaluations to test discoverability, adherence, and output quality'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  tasks:
    description: 'Path to tasks YAML file'
    required: true
  runner:
    description: 'Runner type: claude-sdk, vercel-ai, or openai-agents'
    required: false
    default: 'claude-sdk'
  model:
    description: 'Agent model for task execution'
    required: false
    default: 'sonnet'
  judge-model:
    description: 'Model for LLM-as-judge scoring'
    required: false
    default: 'haiku'
  config:
    description: 'Path to eval.config.yaml'
    required: false
  threshold-discovery:
    description: 'Minimum discovery rate (0-1)'
    required: false
    default: '0.8'
  threshold-score:
    description: 'Minimum average score (1-5)'
    required: false
    default: '4.0'
  timeout:
    description: 'Per-task timeout in milliseconds'
    required: false
    default: '300000'
  tasks-filter:
    description: 'Comma-separated list of task IDs to run'
    required: false
  skills-dir:
    description: 'Path to skills directory for local setup'
    required: false
  working-directory:
    description: 'Working directory for agent execution'
    required: false
    default: '.'
  no-judge:
    description: 'Skip LLM judge scoring (deterministic only)'
    required: false
    default: 'false'
  no-deterministic:
    description: 'Skip deterministic scoring (LLM judge only)'
    required: false
    default: 'false'
  runs:
    description: 'Number of times to run each task (default: 3)'
    required: false
    default: '3'
  anthropic-api-key:
    description: 'Anthropic API key (or use ANTHROPIC_API_KEY env var)'
    required: false
  openai-api-key:
    description: 'OpenAI API key for vercel-ai (openai:) or openai-agents runner (or use OPENAI_API_KEY env var)'
    required: false
  google-api-key:
    description: 'Google AI API key for vercel-ai (google:) runner (or use GOOGLE_GENERATIVE_AI_API_KEY env var)'
    required: false
  openrouter-api-key:
    description: 'OpenRouter API key for vercel-ai (openrouter:) runner (or use OPENROUTER_API_KEY env var)'
    required: false
  generate-feedback:
    description: 'Path to write feedback template JSON after run'
    required: false
  feedback:
    description: 'Path to human review feedback JSON for judge prompt enrichment'
    required: false
  compare:
    description: 'Run with and without skill to compute impact deltas (true/false)'
    required: false
    default: 'false'
  compare-skill:
    description: 'Path to alternative skill version for comparison'
    required: false

outputs:
  passed:
    description: 'Whether all thresholds were met (true/false)'
  discovery-rate:
    description: 'Discovery rate achieved (0-1)'
  avg-score:
    description: 'Average weighted score achieved'
  report-path:
    description: 'Path to generated markdown report'
  json-path:
    description: 'Path to generated JSON report'
  feedback-template-path:
    description: 'Path to generated feedback template (if --generate-feedback used)'
  adherence-delta:
    description: 'Adherence delta (with minus without skill), only set in compare mode'
  output-delta:
    description: 'Output quality delta (with minus without skill), only set in compare mode'
  score-delta:
    description: 'Weighted score delta (with minus without skill), only set in compare mode'

runs:
  using: 'node20'
  main: 'dist/action/index.js'
