name: 'Agent Skill Evaluation'
description: 'Run agent skill evaluations with deterministic rewards: resolution rate, pass@k, skill lift, and invocation rate'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  tasks:
    description: 'Path to a task-package directory or a suite directory of task packages'
    required: true
  runner:
    description: 'Runner type: claude-sdk or claude-code (requires Claude Code CLI on the runner)'
    required: false
    default: 'claude-sdk'
  model:
    description: 'Agent model for task execution'
    required: false
    default: 'sonnet'
  judge-model:
    description: 'Model for LLM-as-judge diagnostics'
    required: false
    default: 'haiku'
  config:
    description: 'Path to eval.config.yaml'
    required: false
  threshold-resolution:
    description: 'Minimum with-skill resolution rate (0-1)'
    required: false
    default: '0.8'
  threshold-lift:
    description: 'Minimum macro skill lift (unset = not gated)'
    required: false
  timeout:
    description: 'Per-task timeout in milliseconds'
    required: false
    default: '300000'
  concurrency:
    description: 'Max concurrent tasks (1=sequential, 0=unlimited)'
    required: false
    default: '1'
  tasks-filter:
    description: 'Comma-separated list of task IDs to run'
    required: false
  skills-dir:
    description: 'Path to skills directory for local setup'
    required: false
  working-directory:
    description: 'Working directory for agent execution'
    required: false
    default: '.'
  baseline:
    description: 'Run the paired no-skill baseline condition (true/false)'
    required: false
    default: 'true'
  judge:
    description: 'Enable LLM judge diagnostics (true/false; never affects pass/fail)'
    required: false
    default: 'false'
  runs:
    description: 'Number of trials per task per condition (default: 3)'
    required: false
    default: '3'
  anthropic-api-key:
    description: 'Anthropic API key (or use ANTHROPIC_API_KEY env var)'
    required: false
  generate-feedback:
    description: 'Path to write feedback template JSON after run'
    required: false
  feedback:
    description: 'Path to human review feedback JSON for judge prompt enrichment (requires judge)'
    required: false
  compare-skill:
    description: 'Path to baseline skill directory (e.g., previous version) for A/B comparison'
    required: false
  compare-label:
    description: 'Custom label for the baseline in comparison reports'
    required: false
  compare-results:
    description: 'Path to a previous run summary.json for cross-iteration comparison'
    required: false
  blind-compare:
    description: 'Run blind A/B comparison of two skill versions (requires compare-skill and judge)'
    required: false
    default: 'false'

outputs:
  passed:
    description: 'Whether all thresholds were met (true/false)'
  resolution-rate:
    description: 'With-skill resolution rate achieved (0-1)'
  pass-at-k:
    description: 'Share of tasks with at least one passing trial (0-1)'
  skill-lift:
    description: 'Macro skill lift (with-skill minus baseline resolution rate), only set when the baseline ran'
  invocation-rate:
    description: 'Skill invocation rate over invocation-expecting tasks (0-1), when available'
  report-path:
    description: 'Path to generated markdown report'
  json-path:
    description: 'Path to generated JSON report'
  summary-json-path:
    description: 'Path to the machine-readable summary.json'
  feedback-template-path:
    description: 'Path to generated feedback template (if generate-feedback used)'
  has-regressions:
    description: 'Whether any tasks regressed significantly vs. previous results (true/false)'
  blind-with-skill-preferred:
    description: 'Number of tasks where blind comparison preferred the with-skill output'
  blind-without-skill-preferred:
    description: 'Number of tasks where blind comparison preferred the without-skill output'
  blind-bias-signals:
    description: 'Number of tasks where blind comparison disagrees with standard scoring'

runs:
  using: 'node20'
  main: 'dist/index.cjs'
